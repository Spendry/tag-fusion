name: Suggest a website
description: Propose an independent website for the directory. A person reads every suggestion.
title: "Suggest: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public. TagFusion does not list sites whose main content is adult material, gambling, the sale or dosing of drugs, piracy, malware, scams, or hate.
  - type: input
    id: name
    attributes:
      label: Website name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Address
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is it, in a sentence or two?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Creative tools
        - Learn & think
        - Independent web
        - Play & wander
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Up to four tags
      placeholder: indie, visual, maps
    validations:
      required: true
  - type: checkboxes
    id: own
    attributes:
      label: Your connection to it
      options:
        - label: This is my own site or project
